server:
  port: 6000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: expert-service
          uri: lb://expert-service
          predicates:
            - Path=/expert/**
        
        - id: parent-service
          uri: lb://parent-service
          predicates:
            - Path=/**
        - id: file-service
          uri: lb://parent-service
          predicates:
            - Path=/child/file/**